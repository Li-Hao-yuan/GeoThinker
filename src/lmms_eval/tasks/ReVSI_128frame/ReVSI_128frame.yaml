# Local experiment: all_frame annotations, uniformly sampled 128-frame input.
dataset_path: data/evaluation/ReVSI_128frame
dataset_kwargs:
  token: True
task: ReVSI_128frame
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs
doc_to_visual: !function utils.ReVSI_128frame_doc_to_visual
doc_to_text: !function utils.ReVSI_128frame_doc_to_text
doc_to_target: "ground_truth"
generation_kwargs:
  max_new_tokens: 128 
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.ReVSI_128frame_process_results
metric_list:
  - metric: ReVSI_128frame_score
    aggregation: !function utils.ReVSI_128frame_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    mca_post_prompt: "Answer with the option's letter from the given choices directly."
    na_post_prompt: "Answer using a single number."
  gemini_api:
    pre_prompt: ""
    mca_post_prompt: "Answer with the option's letter from the given choices directly."
    na_post_prompt: "Do not response anything other than a single number!"
  gpt4v:
    pre_prompt: ""
    mca_post_prompt: "Answer with the option's letter from the given choices directly."
    na_post_prompt: "Do not response anything other than a single number!"
metadata:
  version: 1.0
